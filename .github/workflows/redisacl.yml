name: Redis ACL enforcement

on:
  pull_request:
    branches: [main]
    paths:
      - 'redisacl/**'
      - '.github/workflows/redisacl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l redisacl)"
          if [[ -n "$files" ]]; then
            printf 'gofmt required:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Vet Redis ACL packages
        run: go vet ./redisacl/...
      - name: Test Redis ACL packages
        run: go test ./redisacl/...
